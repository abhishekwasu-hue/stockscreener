# Local / single-server deployment. Copy .env.example to .env and set secrets there (never in this file).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: amw
      POSTGRES_USER: amw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amw -d amw"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://amw:${POSTGRES_PASSWORD}@db:5432/amw
    ports: ["8501:8501"]
    depends_on: {db: {condition: service_healthy}}
    cap_add: [SYS_ADMIN]                 # required by the Strategy Lab sandbox (namespaces); see docs/SECURITY.md
    security_opt: ["apparmor:unconfined"]
    volumes: [cache:/opt/amw/.cache, reports:/opt/amw/data/reports]   # reports shared with the api container
    restart: unless-stopped

  api:
    build: .
    command: ["python", "api_server.py"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://amw:${POSTGRES_PASSWORD}@db:5432/amw
      AMW_API_HOST: 0.0.0.0
      AMW_AUTH_MODE: token
      AMW_API_WORKERS: ${AMW_API_WORKERS:-4}   # Q-014 initial production value; measured, not a capacity guarantee
    ports: ["8000:8000"]
    volumes: [reports:/opt/amw/data/reports]
    depends_on: {db: {condition: service_healthy}}
    cap_add: [SYS_ADMIN]
    security_opt: ["apparmor:unconfined"]
    restart: unless-stopped

volumes:
  pgdata:
  cache:
  reports:
